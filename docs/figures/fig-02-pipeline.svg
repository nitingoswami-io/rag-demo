  <path d="M945 320 L945 400" marker-end="url(#arrow)"/>
  <path d="M295 320 L295 400" marker-end="url(#arrow)"/>
</g>
<g fill="currentColor" stroke="none">
  <text x="450" y="32" text-anchor="middle" font-size="12">Ingestion · startup · samples.seed()</text>
  <text x="110" y="232" text-anchor="middle" font-size="12">Query · POST /chat</text>
  <text x="95.0" y="87.0" text-anchor="middle">Sample docs</text>
  <text x="95.0" y="103.0" text-anchor="middle" font-size="11">packs.json + files</text>
  <text x="295.0" y="87.0" text-anchor="middle">Load + chunk</text>
  <text x="295.0" y="103.0" text-anchor="middle" font-size="11">1000 chars · 150 overlap</text>
  <text x="520.0" y="87.0" text-anchor="middle">OpenAI embeddings</text>
  <text x="520.0" y="103.0" text-anchor="middle" font-size="11">text-embedding-3-small</text>
  <text x="740" y="92" text-anchor="middle" class="sk-accent">pgvector</text>
  <text x="740" y="108" text-anchor="middle" font-size="11">chunks + 1536-d vectors</text>
  <rect class="sk-bg" x="172" y="68" width="35" height="17" rx="3"/>
  <text x="190" y="80" text-anchor="middle" font-size="12">text</text>
  <rect class="sk-bg" x="376" y="68" width="48" height="17" rx="3"/>
  <text x="400" y="80" text-anchor="middle" font-size="12">chunks</text>
  <rect class="sk-bg" x="614" y="68" width="42" height="17" rx="3"/>
  <text x="635" y="80" text-anchor="middle" font-size="12">store</text>
  <text x="90.0" y="287.0" text-anchor="middle">Question</text>
  <text x="90.0" y="303.0" text-anchor="middle" font-size="11">+ chosen pack</text>
  <text x="295.0" y="287.0" text-anchor="middle" class="sk-accent">Retrieve</text>
  <text x="295.0" y="303.0" text-anchor="middle" font-size="11">cosine top-4 · pack filter</text>
  <text x="525.0" y="287.0" text-anchor="middle" class="sk-accent">Prompt</text>
  <text x="525.0" y="303.0" text-anchor="middle" font-size="11">rules + chunks + 6 turns</text>
  <text x="745.0" y="287.0" text-anchor="middle" class="sk-accent">LLM · gpt-4o-mini</text>
  <text x="745.0" y="303.0" text-anchor="middle" font-size="11">temperature 0</text>
  <text x="945.0" y="287.0" text-anchor="middle" class="sk-accent">Answer</text>
  <text x="945.0" y="303.0" text-anchor="middle" font-size="11">cites [file p.N]</text>
  <rect class="sk-bg" x="166" y="268" width="28" height="17" rx="3"/>
  <text x="180" y="280" text-anchor="middle" font-size="12">ask</text>
  <rect class="sk-bg" x="321" y="190" width="102" height="17" rx="3"/>
  <text x="372" y="202" text-anchor="middle" font-size="12">embed question</text>
  <rect class="sk-bg" x="500" y="174" width="149" height="17" rx="3"/>
  <text x="575" y="186" text-anchor="middle" class="sk-accent" font-size="12">top-4 chunks + scores</text>
  <text x="520.0" y="425.0" text-anchor="middle">Evidence panels</text>
  <text x="520.0" y="441.0" text-anchor="middle" font-size="11">answer sources: rank · page · similarity · cited · pgvector rows · timings</text>
  <rect class="sk-bg" x="888" y="350" width="115" height="17" rx="3"/>
  <text x="945" y="362" text-anchor="middle" font-size="12">answer + sources</text>
  <rect class="sk-bg" x="238" y="350" width="115" height="17" rx="3"/>
  <text x="295" y="362" text-anchor="middle" font-size="12">scores · timings</text>
</g>
</svg>
