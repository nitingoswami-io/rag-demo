  <path d="M20 48 V40 H880 V48" stroke-width="1.1"/>
  <path d="M20 248 V240 H1020 V248" stroke-width="1.1"/>
  <rect x="20" y="60" width="150" height="60" rx="6"/>
  <rect x="210" y="60" width="170" height="60" rx="6"/>
  <rect x="420" y="60" width="200" height="60" rx="6"/>
  <rect x="424" y="64" width="192" height="52" rx="3"/>
  <path class="sk-accent" d="M650.0 62 A90.0 10 0 0 0 830.0 62 A90.0 10 0 0 0 650.0 62 V122 A90.0 10 0 0 0 830.0 122 V62"/>
  <path d="M170 90 L210 90" marker-end="url(#arrow)"/>
  <path d="M380 90 L420 90" marker-end="url(#arrow)"/>
  <path d="M620 90 L650 90" marker-end="url(#arrow)"/>
  <rect x="20" y="260" width="140" height="60" rx="6"/>
  <rect x="200" y="260" width="190" height="60" rx="6" class="sk-accent"/>
  <rect x="430" y="260" width="190" height="60" rx="6" class="sk-accent"/>
  <rect x="660" y="260" width="170" height="60" rx="6" class="sk-accent"/>
  <rect x="664" y="264" width="162" height="52" rx="3" class="sk-accent"/>
  <rect x="870" y="260" width="150" height="60" rx="6" class="sk-accent"/>
  <path d="M160 290 L200 290" marker-end="url(#arrow)"/>
  <path d="M300 260 L470 122" marker-end="url(#arrow)"/>
